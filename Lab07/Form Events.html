<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Form Events</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f4f7;
    padding:40px;
}

h1{
    color:#1e63b6;
}

.subtitle{
    margin-bottom:30px;
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    width:500px;
}

input{
    width:100%;
    padding:15px;
    font-size:16px;
    border:2px solid #ccc;
    border-radius:10px;
    outline:none;
    transition:0.3s;
}
</style>

</head>

<body>

<h1>Form Events - การทำงานกับฟอร์ม</h1>
<p class="subtitle">ลองคลิกเข้าและออกจากช่อง Input เพื่อดูผลลัพธ์:</p>

<div class="container">
    <input type="text" id="username" placeholder="Username (ต้องมี 3+ ตัวอักษร)">
</div>

<script>

let username = document.getElementById("username");

// เมื่อคลิกเข้า input
username.addEventListener("focus", function(){

    this.style.backgroundColor = "#e3f2fd";

});

// เมื่อคลิกออก
username.addEventListener("blur", function(){

    this.style.backgroundColor = "";

    // ตรวจสอบจำนวนตัวอักษร
    if(this.value.length < 3){

        this.style.borderColor = "red";

    }else{

        this.style.borderColor = "green";

    }

});

</script>

</body>
</html>
